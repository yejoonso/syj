<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK2 | SEM Simulator</title>
<style>
:root{color-scheme:dark;--bg:#08111d;--panel:#101e2e;--line:#263b52;--text:#e8f1fb;--muted:#9bb0c5;--cyan:#55d7ed;--yellow:#ffd166;--green:#80ed99}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#19324a 0,#08111d 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1400px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
h1{font-size:clamp(26px,4vw,38px);letter-spacing:2px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:4px}
.status{border:1px solid #31536c;border-radius:999px;padding:7px 12px;color:var(--green);font-size:12px;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:16px}
.panel{background:linear-gradient(160deg,#122337,#0d1928);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 35px #0004;min-width:0}
.panel h2{font-size:15px;margin:0 0 10px;color:#cfe5f7}
.canvasWrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#050b12}
canvas{display:block;width:100%;height:auto}
#scene{aspect-ratio:900/570}
#micro{aspect-ratio:600/450}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:11px;margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.controls{display:grid;gap:13px}
.control{display:grid;gap:6px}
.control label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#c4d5e5}
input[type=range],select{width:100%;accent-color:var(--cyan)}
select{background:#0b1725;color:var(--text);border:1px solid #36506a;border-radius:8px;padding:9px}
button{border:0;border-radius:9px;padding:10px 13px;background:linear-gradient(90deg,#16a8c5,#327de0);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#20364d;border:1px solid #38536e}
button:disabled{opacity:.55;cursor:wait}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metric{background:#091522;border:1px solid #20364b;border-radius:10px;padding:9px}
.metric small{display:block;color:var(--muted);font-size:10px}
.metric strong{font-size:16px}
.note{color:var(--muted);font-size:11px;line-height:1.55;margin:10px 0 0}
.progress{height:6px;background:#1b3045;border-radius:10px;overflow:hidden;margin-top:10px}
#bar{height:100%;width:0;background:linear-gradient(90deg,#48d9e8,#ffd166);transition:width .08s linear}
@media(max-width:850px){.layout{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<main>
<header>
 <div><h1>MK2</h1><div class="subtitle">Scanning Electron Microscope · 교육용 시뮬레이터</div></div>
 <div class="status" id="status">준비 완료</div>
</header>
<div class="layout">
 <section class="panel">
  <h2>① SEM 내부 작동 과정</h2>
  <div class="canvasWrap"><canvas id="scene" width="900" height="570"></canvas></div>
  <div class="legend">
   <span><i class="dot" style="background:#ffd166"></i>1차 전자</span>
   <span><i class="dot" style="background:#55d7ed"></i>2차 전자</span>
   <span><i class="dot" style="background:#80ed99"></i>검출기 신호</span>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="readout">
   <div class="metric"><small>주사 진행률</small><strong id="progressText">0%</strong></div>
   <div class="metric"><small>현재 픽셀 신호</small><strong id="signalText">—</strong></div>
  </div>
 </section>
 <section class="panel">
  <h2>② 검출 신호로 만든 SEM 이미지</h2>
  <div class="canvasWrap"><canvas id="micro" width="600" height="450"></canvas></div>
  <div class="controls" style="margin-top:14px">
   <div class="control"><label for="speed">주사 속도 <b id="speedVal">빠름 · 8</b></label><input id="speed" type="range" min="1" max="10" value="8"></div>
   <div class="control"><label for="eff">검출 효율 <b id="effVal">80%</b></label><input id="eff" type="range" min="20" max="100" value="80"></div>
   <div class="control"><label for="sample">시료 형태</label>
    <select id="sample"><option value="bacillus">막대형 세균(편모·섬모 모사)</option><option value="coccus">구형 세균 군집</option><option value="spore">가시 돌기가 많은 포자형 입자</option></select>
   </div>
   <div class="buttons">
    <button id="start">▶ 주사 시작</button><button id="pause" class="secondary">Ⅱ 일시정지</button><button id="reset" class="secondary">↺ 초기화</button><button id="save" class="secondary">PNG 저장</button>
   </div>
  </div>
  <p class="note">이미지는 시료 표면의 높이·기울기와 2차 전자 검출량을 단순화해 계산한 교육용 결과입니다. 실제 SEM에서는 전자총에서 나온 1차 전자가 시료에 입사하고, 시료에서 방출된 2차 전자가 별도의 검출기로 이동합니다.</p>
 </section>
</div>
</main>
<script>
"use strict";
const scene=document.getElementById('scene'), sc=scene.getContext('2d');
const micro=document.getElementById('micro'), mc=micro.getContext('2d');
const W=150,H=112, gun={x:145,y:72}, detector={x:745,y:92}, sampleY=420;
const heightMap=new Float32Array(W*H), signalMap=new Float32Array(W*H);
let scan=0, running=false, lastTime=0, accumulator=0, currentSignal=0, raf=0;
let speed=8, efficiency=.8, sampleType='bacillus';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=(x,y,cx,cy,sx,sy)=>Math.exp(-(((x-cx)/sx)**2+((y-cy)/sy)**2)*.5);
function capsuleDistance(x,y,x1,y1,x2,y2){let dx=x2-x1,dy=y2-y1,t=clamp(((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(x-(x1+t*dx),y-(y1+t*dy));}
function buildSample(){
 heightMap.fill(0);signalMap.fill(0);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let u=x/W,v=y/H,h=0;
  if(sampleType==='bacillus'){
   const d=capsuleDistance(u,v,.20,.52,.80,.48);
   h+=.78*Math.exp(-Math.pow(d/.105,4));
   h+=.13*gauss(u,v,.5,.5,.34,.11);
   // 짧고 뾰족한 표면 돌기(섬모)를 방사형으로 배치
   for(let i=0;i<30;i++){let t=i/30*Math.PI*2,px=.5+Math.cos(t)*.27,py=.5+Math.sin(t)*.105;
    let dx=u-px,dy=(v-py)*1.7,along=dx*Math.cos(t)+dy*Math.sin(t),side=-dx*Math.sin(t)+dy*Math.cos(t);
    if(along>0&&along<.075)h+=.19*Math.exp(-Math.pow(side/.012,2))*Math.pow(1-along/.075,.8);
   }
   // 양 끝의 긴 편모
   for(let k of [-1,1]){let cx=k<0?.20:.80,cy=k<0?.52:.48;
    let d2=capsuleDistance(u,v,cx,cy,cx+k*.13,cy+(.07*k));
    h+=.10*Math.exp(-Math.pow(d2/.012,2));
   }
  }else if(sampleType==='coccus'){
   for(let j=0;j<3;j++)for(let i=0;i<4;i++){let cx=.23+i*.18+(j%2)*.07,cy=.30+j*.19;
    let r=Math.hypot((u-cx)*1.0,(v-cy)*1.1);
    h+=.75*Math.exp(-Math.pow(r/.105,4));
   }
  }else{
   let r=Math.hypot((u-.5)*1.0,(v-.5)*1.0);
   h+=.72*Math.exp(-Math.pow(r/.24,6));
   for(let i=0;i<22;i++){let t=i/22*Math.PI*2,px=.5+Math.cos(t)*.20,py=.5+Math.sin(t)*.20;
    let along=(u-px)*Math.cos(t)+(v-py)*Math.sin(t),side=-(u-px)*Math.sin(t)+(v-py)*Math.cos(t);
    if(along>0&&along<.12)h+=.3*Math.exp(-Math.pow(side/.014,2))*Math.pow(1-along/.12,.7);
   }
  }
  // 미세한 표면 거칠기
  h+=.008*(Math.sin(x*.73+y*.21)+Math.cos(y*.61-x*.18));
  heightMap[y*W+x]=h;
 }
 renderMicro();
}
function heightAt(x,y){return heightMap[clamp(y,0,H-1)*W+clamp(x,0,W-1)];}
function computeSignal(x,y){
 let h=heightAt(x,y),dx=heightAt(x+1,y)-heightAt(x-1,y),dy=heightAt(x,y+1)-heightAt(x,y-1);
 let nx=-dx*5,ny=-dy*5,nz=1,inv=1/Math.hypot(nx,ny,nz);nx*=inv;ny*=inv;nz*=inv;
 // 검출기는 시료의 오른쪽 위에 위치: 표면 법선과 검출 방향의 내적으로 수집량 근사
 let vx=.55,vy=-.82,vz=.12,vi=1/Math.hypot(vx,vy,vz);vx*=vi;vy*=vi;vz*=vi;
 let facing=Math.max(.12,nx*vx+ny*vy+nz*vz);
 let edge=clamp(h*1.5,0,1);
 return clamp((.12+.55*facing+.35*edge)*efficiency,0,1);
}
function renderMicro(){
 const img=mc.createImageData(W,H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  let h=heightAt(x,y),dx=heightAt(x+1,y)-heightAt(x-1,y),dy=heightAt(x,y+1)-heightAt(x,y-1);
  let shade=clamp(35+computeSignal(x,y)*205+Math.max(0,-dx-dy)*18,0,255);
  let i=(y*W+x)*4;img.data[i]=shade;img.data[i+1]=shade;img.data[i+2]=Math.min(255,shade+8);img.data[i+3]=255;
 }
 const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;tmp.getContext('2d').putImageData(img,0,0);
 mc.imageSmoothingEnabled=true;mc.clearRect(0,0,micro.width,micro.height);mc.drawImage(tmp,0,0,micro.width,micro.height);
}
function drawArrow(ctx,x1,y1,x2,y2,color,width=3){
 ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 let a=Math.atan2(y2-y1,x2-x1),s=11;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45));ctx.lineTo(x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45));ctx.closePath();ctx.fill();
}
function drawScene(){
 sc.clearRect(0,0,900,570);sc.fillStyle='#07111c';sc.fillRect(0,0,900,570);
 // column and electron gun
 sc.fillStyle='#263e55';sc.fillRect(105,35,80,105);sc.fillStyle='#9bb4c9';sc.fillRect(126,45,38,72);
 sc.fillStyle='#ffd166';sc.fillRect(138,115,14,32);
 sc.fillStyle='#c8d8e6';sc.font='bold 16px system-ui';sc.fillText('전자총',105,25);
 // focusing lenses
 for(let y of [175,225,275]){sc.strokeStyle='#56728c';sc.lineWidth=9;sc.beginPath();sc.ellipse(145,y,42,12,0,0,Math.PI*2);sc.stroke();}
 sc.fillStyle='#a9c4d9';sc.font='13px system-ui';sc.fillText('전자기 렌즈',195,226);
 // detector, physically separate from gun
 sc.fillStyle='#254a5b';sc.fillRect(685,42,125,65);sc.fillStyle='#55d7ed';sc.fillRect(702,90,90,13);
 sc.fillStyle='#d9f7ff';sc.font='bold 15px system-ui';sc.fillText('2차 전자 검출기',668,29);
 // sample stage
 sc.fillStyle='#3a5269';sc.fillRect(110,440,680,24);sc.fillStyle='#172b3e';sc.fillRect(140,464,620,26);
 sc.fillStyle='#b4c8d8';sc.font='14px system-ui';sc.fillText('시료 스테이지',120,510);
 // sample illustration on stage
 sc.save();sc.translate(450,425);sc.rotate(-.04);
 sc.fillStyle='#6d8498';sc.beginPath();sc.ellipse(0,0,112,23,0,0,Math.PI*2);sc.fill();
 sc.fillStyle='#a9c4d4';sc.beginPath();sc.ellipse(0,-12,112,25,0,0,Math.PI*2);sc.fill();
 sc.strokeStyle='#d5e6ef';sc.lineWidth=2;
 for(let i=0;i<22;i++){let a=i/22*Math.PI*2,x=Math.cos(a)*75,y=-12+Math.sin(a)*16;sc.beginPath();sc.moveTo(x,y);sc.lineTo(x+Math.cos(a)*18,y+Math.sin(a)*18-8);sc.stroke();}
 sc.restore();
 // primary beam: gun -> specimen (downward)
 drawArrow(sc,145,145,450,397,'#ffd166',3);
 sc.fillStyle='#ffd166';sc.font='13px system-ui';sc.fillText('1차 전자',265,270);
 // secondary electron path: specimen -> separate detector (up-right)
 drawArrow(sc,475,390,720,112,'#55d7ed',3);
 sc.fillStyle='#55d7ed';sc.fillText('2차 전자',555,250);
 // scan marker on specimen
 let px=(scan%(W*H))%W,py=Math.floor(scan/(W*H))*H;
 let sx=300+(px/W)*300,sy=414+(py/H)*14;
 sc.strokeStyle='#80ed99';sc.lineWidth=2;sc.beginPath();sc.arc(sx,sy,9,0,Math.PI*2);sc.stroke();
 sc.fillStyle='#80ed99';sc.fillText('현재 주사 위치',sx+14,sy-10);
 // labels
 sc.fillStyle='#8da7bd';sc.font='12px system-ui';sc.fillText('전자빔 주사 방향',300,535);
}
function update(){
 let p=scan/(W*H);document.getElementById('bar').style.width=(p*100)+'%';document.getElementById('progressText').textContent=Math.floor(p*100)+'%';
 document.getElementById('signalText').textContent=currentSignal.toFixed(2);
 drawScene();
}
function tick(t){
 if(!running)return;
 let dt=Math.min(50,t-lastTime);lastTime=t;accumulator+=dt;
 // 속도 1~10: 한 프레임에 여러 픽셀 처리해 빠르게 진행
 let count=Math.max(1,Math.round(speed*2));
 for(let n=0;n<count;n++){
  if(scan>=W*H){running=false;document.getElementById('status').textContent='주사 완료';break;}
  let x=scan%W,y=Math.floor(scan/W);currentSignal=computeSignal(x,y);signalMap[scan]=currentSignal;scan++;
 }
 update();
 if(running)raf=requestAnimationFrame(tick);
}
function start(){if(scan>=W*H)scan=0;running=true;lastTime=performance.now();document.getElementById('status').textContent='주사 중';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);}
function pause(){running=false;cancelAnimationFrame(raf);document.getElementById('status').textContent='일시정지';}
function reset(){pause();scan=0;currentSignal=0;update();document.getElementById('status').textContent='준비 완료';}
document.getElementById('start').addEventListener('click',start);
document.getElementById('pause').addEventListener('click',pause);
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('save').addEventListener('click',()=>{let a=document.createElement('a');a.download='MK2-SEM-image.png';a.href=micro.toDataURL('image/png');a.click();});
document.getElementById('speed').addEventListener('input',e=>{speed=+e.target.value;document.getElementById('speedVal').textContent=(speed>=8?'빠름':speed>=4?'보통':'느림')+' · '+speed;});
document.getElementById('eff').addEventListener('input',e=>{efficiency=+e.target.value/100;document.getElementById('effVal').textContent=e.target.value+'%';renderMicro();});
document.getElementById('sample').addEventListener('change',e=>{sampleType=e.target.value;reset();buildSample();});
buildSample();update();
</script>
</body>
</html>
